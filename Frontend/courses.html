<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f3f4f6;
    }

    /* ================= HOVER EFFECTS ================= */

    .course-card{
      transition:0.3s ease;
    }

    .course-card:hover{
      transform:translateY(-6px);
      box-shadow:0 12px 25px rgba(0,0,0,0.08);
    }

    .category-item{
      transition:0.3s;
    }

    .category-item:hover{
      background:#eff6ff;
      color:#2563eb;
      transform:translateX(4px);
    }

    .nav-link{
      transition:0.3s;
    }

    .nav-link:hover{
      color:#2563eb;
    }

    .continue-btn{
      transition:0.3s;
    }

    .continue-btn:hover{
      transform:scale(1.03);
    }

  </style>

</head>

<body>

  <!-- ================= MAIN CONTAINER ================= -->

  <div class="w-[95%] max-w-[1600px] mx-auto py-6">

    <!-- ================= NAVBAR ================= -->

    <div class="bg-white shadow-md rounded-2xl px-6 py-4 flex justify-between items-center mb-8">

      <!-- LEFT -->

      <div class="flex items-center gap-10">

        <!-- LOGO -->

        <div
          class="text-2xl font-semibold text-blue-500 cursor-pointer"
          onclick="window.location.href='dashboard.html'">

          EduLearn

        </div>

        <!-- MENU -->

        <div class="hidden md:flex gap-8 text-gray-600 font-medium">

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='dashboard.html'">

            Home

          </span>

          <span class="cursor-pointer text-blue-500">
            Courses
          </span>

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='community.html'">

            Community

          </span>

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='profile.html'">

            Profile

          </span>

        </div>

      </div>

      <!-- RIGHT -->

      <div class="flex items-center gap-5">

        <span class="material-symbols-outlined cursor-pointer text-gray-600 hover:text-blue-500">
          notifications
        </span>

        <!-- PROFILE -->

        <div class="relative">

          <div
            onclick="toggleDropdown()"
            class="w-10 h-10 rounded-full bg-gray-300 cursor-pointer overflow-hidden">

            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400"
              class="w-full h-full object-cover"
            >

          </div>

          <!-- DROPDOWN -->

          <div
            id="dropdown"
            class="hidden absolute right-0 mt-3 bg-white shadow-lg rounded-xl w-36 overflow-hidden z-50">

            <div
              onclick="window.location.href='profile.html'"
              class="p-3 hover:bg-gray-100 cursor-pointer">

              Profile

            </div>

            <div
              onclick="logout()"
              class="p-3 hover:bg-gray-100 cursor-pointer">

              Logout

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- ================= PAGE HEADER ================= -->

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5 mb-8">

      <div>

        <h1 class="text-4xl font-bold text-gray-800 mb-2">
          My Courses
        </h1>

        <p class="text-gray-500">
          Continue learning and improve your skills.
        </p>

      </div>

      <!-- SEARCH -->

      <div class="w-full lg:w-[350px]">

        <input
          type="text"
          id="searchInput"
          placeholder="Search courses..."
          class="w-full p-3 rounded-2xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        >

      </div>

    </div>

    <!-- ================= CONTENT ================= -->

    <div class="flex flex-col xl:flex-row gap-6">

      <!-- ================= SIDEBAR ================= -->

      <div class="xl:w-64 w-full">

        <div class="bg-white rounded-2xl shadow-sm p-5 sticky top-5">

          <h3 class="text-xl font-semibold text-gray-700 mb-5">
            Categories
          </h3>

          <ul class="space-y-3 text-gray-600">

            <li
              class="bg-blue-100 text-blue-600 px-4 py-3 rounded-2xl font-medium cursor-pointer category-item"
              data-category="All"
            >
              All Courses
            </li>

            <li
              class="px-4 py-3 rounded-2xl cursor-pointer category-item"
              data-category="Backend"
            >
              Backend
            </li>

            <li
              class="px-4 py-3 rounded-2xl cursor-pointer category-item"
              data-category="Frontend"
            >
              Frontend
            </li>

            <li
              class="px-4 py-3 rounded-2xl cursor-pointer category-item"
              data-category="Marketing"
            >
              Marketing
            </li>

          </ul>

        </div>

      </div>

      <!-- ================= COURSE GRID ================= -->

      <div
        id="coursesContainer"
        class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"
      >

        <!-- Dynamic Courses -->

      </div>

    </div>

  </div>

  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const API_BASE_URL =
      "http://localhost:8081/api/courses";

    const coursesContainer =
      document.getElementById("coursesContainer");

    const searchInput =
      document.getElementById("searchInput");

    const categoryItems =
      document.querySelectorAll(".category-item");


    // ================= LOAD COURSES =================

    async function loadCourses() {

      try {

        coursesContainer.innerHTML = `

          <div class="col-span-full bg-white rounded-2xl shadow-sm p-10 text-center">

            <div class="w-20 h-20 mx-auto rounded-2xl bg-blue-100 flex items-center justify-center mb-5">

              <span class="material-symbols-outlined text-blue-500 text-4xl">
                progress_activity
              </span>

            </div>

            <h3 class="text-2xl font-semibold text-gray-800 mb-2">
              Loading Courses...
            </h3>

            <p class="text-gray-500">
              Please wait while we fetch your courses.
            </p>

          </div>

        `;

        const response = await fetch(API_BASE_URL);

        if (!response.ok) {
          throw new Error("Failed to fetch courses");
        }

        const courses = await response.json();

        renderCourses(courses);

      } catch (error) {

        console.error(error);

        coursesContainer.innerHTML = `

          <div class="col-span-full bg-white rounded-2xl shadow-sm p-10 text-center">

            <div class="w-20 h-20 mx-auto rounded-2xl bg-red-100 flex items-center justify-center mb-5">

              <span class="material-symbols-outlined text-red-500 text-4xl">
                error
              </span>

            </div>

            <h3 class="text-2xl font-semibold text-gray-800 mb-2">
              Failed to load courses
            </h3>

            <p class="text-gray-500">
              Something went wrong while fetching courses.
            </p>

          </div>

        `;
      }

    }


    // ================= RENDER COURSES =================

    function renderCourses(courses) {

      coursesContainer.innerHTML = "";

      if (courses.length === 0) {

        coursesContainer.innerHTML = `

          <div class="col-span-full bg-white rounded-2xl shadow-sm p-10 text-center">

            <div class="w-20 h-20 mx-auto rounded-2xl bg-blue-100 flex items-center justify-center mb-5">

              <span class="material-symbols-outlined text-blue-500 text-4xl">
                menu_book
              </span>

            </div>

            <h3 class="text-2xl font-semibold text-gray-800 mb-2">
              No courses found
            </h3>

            <p class="text-gray-500">
              Try searching with different keywords or categories.
            </p>

          </div>

        `;

        return;
      }

      courses.forEach(course => {

        const courseCard =
          document.createElement("div");

        courseCard.className =
          "bg-white rounded-2xl shadow-sm overflow-hidden course-card flex flex-col";

        courseCard.innerHTML = `

          <!-- THUMBNAIL -->

          <div class="relative">

            <img
              src="${course.thumbnail}"
              class="w-full h-52 object-cover"
            />

            <!-- CATEGORY -->

            <div class="absolute top-4 left-4">

              <span class="text-xs bg-white/90 backdrop-blur-sm text-blue-600 px-3 py-1 rounded-full font-medium shadow-sm">

                ${course.category}

              </span>

            </div>

          </div>

          <!-- CONTENT -->

          <div class="p-5 flex flex-col flex-1">

            <!-- TOP -->

            <div class="flex items-center justify-between mb-4">

              <span class="text-sm text-gray-400">

                ${course.totalLessons} Lessons

              </span>

              <span class="text-sm text-green-500 font-medium">

                Beginner

              </span>

            </div>

            <!-- TITLE -->

            <h3 class="text-xl font-semibold text-gray-800 mb-3 leading-snug line-clamp-2">

              ${course.title}

            </h3>

            <!-- DESCRIPTION -->

            <p class="text-sm text-gray-500 leading-relaxed mb-5 line-clamp-3">

              ${course.description}

            </p>

            <!-- PROGRESS -->

            <div class="mb-5">

              <div class="flex items-center justify-between mb-2">

                <span class="text-sm text-gray-500">
                  Progress
                </span>

                <span class="text-sm text-blue-500 font-medium">
                  40%
                </span>

              </div>

              <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">

                <div
                  class="h-2 bg-blue-500 rounded-full"
                  style="width:40%">
                </div>

              </div>

            </div>

            <!-- FOOTER -->

            <div class="flex items-center justify-between gap-4 mt-auto">

              <!-- INSTRUCTOR -->

              <div class="flex items-center gap-3 min-w-0">

                <div class="w-11 h-11 rounded-full overflow-hidden bg-gray-200 flex-shrink-0">

                  <img
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400"
                    class="w-full h-full object-cover"
                  >

                </div>

                <div class="min-w-0">

                  <p class="text-xs text-gray-400 mb-1">
                    Instructor
                  </p>

                  <p class="text-sm font-semibold text-gray-700 truncate">

                    ${course.instructorName}

                  </p>

                </div>

              </div>

              <!-- BUTTON -->

              <button
                onclick="openCourse(${course.id})"
                class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-3 rounded-xl continue-btn text-sm whitespace-nowrap shadow-sm"
              >

                Continue

              </button>

            </div>

          </div>

        `;

        coursesContainer.appendChild(courseCard);

      });

    }


    // ================= OPEN PLAYER =================

    function openCourse(courseId) {

      window.location.href =
        `player.html?courseId=${courseId}`;

    }


    // ================= SEARCH =================

    searchInput.addEventListener("input", async (e) => {

      const keyword =
        e.target.value.trim();

      try {

        let url = API_BASE_URL;

        if (keyword.length > 0) {

          url =
            `${API_BASE_URL}/search?keyword=${keyword}`;

        }

        const response =
          await fetch(url);

        const courses =
          await response.json();

        renderCourses(courses);

      } catch (error) {

        console.error(error);

      }

    });


    // ================= CATEGORY FILTER =================

    categoryItems.forEach(item => {

      item.addEventListener("click", async () => {

        // REMOVE ACTIVE STATE

        categoryItems.forEach(i => {

          i.classList.remove(
            "bg-blue-100",
            "text-blue-600",
            "font-medium"
          );

        });

        // ACTIVE STATE

        item.classList.add(
          "bg-blue-100",
          "text-blue-600",
          "font-medium"
        );

        const category =
          item.dataset.category;

        try {

          let url = API_BASE_URL;

          if (category !== "All") {

            url =
              `${API_BASE_URL}/category/${category}`;

          }

          const response =
            await fetch(url);

          const courses =
            await response.json();

          renderCourses(courses);

        } catch (error) {

          console.error(error);

        }

      });

    });


    // ================= TOGGLE DROPDOWN =================

    function toggleDropdown(){

      const dropdown =
        document.getElementById('dropdown');

      dropdown.classList.toggle('hidden');

    }


    // ================= LOGOUT =================

    function logout(){

      localStorage.clear();

      window.location.href = "index.html";

    }


    // ================= CLOSE DROPDOWN =================

    window.addEventListener('click', function(e){

      const profile =
        document.querySelector('.relative');

      const dropdown =
        document.getElementById('dropdown');

      if(!profile.contains(e.target)){

        dropdown.classList.add('hidden');

      }

    });


    // ================= INITIAL LOAD =================

    loadCourses();

  </script>

</body>
</html>
