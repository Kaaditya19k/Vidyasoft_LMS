<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f3f4f6;
    }

    /* Smooth Hover Effects */

    .course-card{
      transition:0.3s ease;
    }

    .course-card:hover{
      transform:translateY(-6px);
      box-shadow:0 12px 25px rgba(0,0,0,0.08);
    }

    .category-item{
      transition:0.3s;
    }

    .category-item:hover{
      background:#eff6ff;
      color:#2563eb;
      transform:translateX(4px);
    }

    .nav-link{
      transition:0.3s;
    }

    .nav-link:hover{
      color:#2563eb;
    }

    .continue-btn{
      transition:0.3s;
    }

    .continue-btn:hover{
      transform:scale(1.02);
    }

  </style>
</head>

<body>

  <!-- MAIN CONTAINER -->

  <div class="w-[95%] max-w-[1600px] mx-auto py-6">

    <!-- ================= NAVBAR ================= -->

    <div class="bg-white shadow-md rounded-2xl px-6 py-4 flex justify-between items-center mb-8">

      <!-- LEFT -->

      <div class="flex items-center gap-10">

        <!-- LOGO -->

        <div
          class="text-2xl font-semibold text-blue-500 cursor-pointer"
          onclick="window.location.href='dashboard.html'">

          EduLearn

        </div>

        <!-- MENU -->

        <div class="hidden md:flex gap-8 text-gray-600 font-medium">

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='dashboard.html'">

            Home

          </span>

          <span class="cursor-pointer text-blue-500">
            Courses
          </span>

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='community.html'">

            Community

          </span>

          <span
            class="cursor-pointer nav-link"
            onclick="window.location.href='profile.html'">

            Profile

          </span>

        </div>

      </div>

      <!-- RIGHT -->

      <div class="flex items-center gap-5">

        <span class="material-symbols-outlined cursor-pointer text-gray-600 hover:text-blue-500">
          notifications
        </span>

        <!-- PROFILE -->

        <div class="relative">

          <div
            onclick="toggleDropdown()"
            class="w-10 h-10 rounded-full bg-gray-300 cursor-pointer overflow-hidden">

            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400"
              class="w-full h-full object-cover"
            >

          </div>

          <!-- DROPDOWN -->

          <div
            id="dropdown"
            class="hidden absolute right-0 mt-3 bg-white shadow-lg rounded-xl w-36 overflow-hidden z-50">

            <div
              onclick="window.location.href='profile.html'"
              class="p-3 hover:bg-gray-100 cursor-pointer">

              Profile

            </div>

            <div
              onclick="logout()"
              class="p-3 hover:bg-gray-100 cursor-pointer">

              Logout

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- ================= PAGE HEADER ================= -->

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5 mb-8">

      <div>

        <h1 class="text-4xl font-bold text-gray-800 mb-2">
          My Courses
        </h1>

        <p class="text-gray-500">
          Continue learning and improve your skills.
        </p>

      </div>

      <!-- SEARCH -->

      <div class="w-full md:w-[350px]">

        <input
          type="text"
          id="searchInput"
          placeholder="Search courses..."
          class="w-full p-3 rounded-2xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        >

      </div>

    </div>

    <!-- ================= CONTENT ================= -->

    <div class="flex flex-col lg:flex-row gap-6">

      <!-- ================= SIDEBAR ================= -->

      <div class="lg:w-56 w-full">

        <div class="bg-white rounded-2xl shadow-sm p-5 sticky top-5">

          <h3 class="text-lg font-semibold text-gray-700 mb-5">
            Categories
          </h3>

          <ul class="space-y-2 text-gray-600">

            <li
              class="bg-blue-100 text-blue-600 px-4 py-3 rounded-xl font-medium cursor-pointer category-item"
              data-category="All"
            >
              All Courses
            </li>

            <li
              class="px-4 py-3 rounded-xl cursor-pointer category-item"
              data-category="Backend"
            >
              Backend
            </li>

            <li
              class="px-4 py-3 rounded-xl cursor-pointer category-item"
              data-category="Frontend"
            >
              Frontend
            </li>

            <li
              class="px-4 py-3 rounded-xl cursor-pointer category-item"
              data-category="Marketing"
            >
              Marketing
            </li>

          </ul>

        </div>

      </div>

      <!-- ================= COURSE GRID ================= -->

      <div
        id="coursesContainer"
        class="flex-1 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5"
      >

        <!-- Dynamic Courses -->

      </div>

    </div>

  </div>

  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const API_BASE_URL =
      "http://localhost:8081/api/courses";

    const coursesContainer =
      document.getElementById("coursesContainer");

    const searchInput =
      document.getElementById("searchInput");

    const categoryItems =
      document.querySelectorAll(".category-item");


    // LOAD COURSES
    async function loadCourses() {

      try {

        coursesContainer.innerHTML = `
          <div class="text-gray-500 text-lg">
            Loading courses...
          </div>
        `;

        const response = await fetch(API_BASE_URL);

        if (!response.ok) {
          throw new Error("Failed to fetch courses");
        }

        const courses = await response.json();

        renderCourses(courses);

      } catch (error) {

        console.error(error);

        coursesContainer.innerHTML = `
          <div class="text-red-500 text-lg">
            Failed to load courses
          </div>
        `;
      }

    }


    // RENDER COURSES
    function renderCourses(courses) {

      coursesContainer.innerHTML = "";

      if (courses.length === 0) {

        coursesContainer.innerHTML = `
          <div class="text-gray-500 text-lg">
            No courses found
          </div>
        `;

        return;
      }

      courses.forEach(course => {

        const courseCard =
          document.createElement("div");

        courseCard.className =
          "bg-white rounded-2xl p-3 shadow-sm course-card";

        courseCard.innerHTML = `

          <img
            src="${course.thumbnail}"
            class="w-full h-24 rounded-xl object-cover mb-3"
          />

          <div class="flex items-center justify-between mb-2">

            <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-medium">
              ${course.category}
            </span>

            <span class="text-[10px] text-gray-400">
              ${course.totalLessons} Lessons
            </span>

          </div>

          <h3 class="text-sm font-semibold text-gray-800 mb-2 line-clamp-2 leading-snug">
            ${course.title}
          </h3>

          <p class="text-xs text-gray-500 mb-3 line-clamp-2">
            ${course.description}
          </p>

          <div class="w-full h-1.5 bg-gray-200 rounded-full mb-3">

            <div
              class="h-1.5 bg-blue-500 rounded-full"
              style="width:40%">
            </div>

          </div>

          <div class="flex items-center justify-between gap-2">

            <div class="min-w-0">

              <p class="text-[10px] text-gray-400">
                Instructor
              </p>

              <p class="text-xs font-semibold text-gray-700 truncate">
                ${course.instructorName}
              </p>

            </div>

            <button
              onclick="openCourse(${course.id})"
              class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg continue-btn text-xs whitespace-nowrap"
            >
              Continue
            </button>

          </div>

        `;

        coursesContainer.appendChild(courseCard);

      });

    }


    // OPEN PLAYER
    function openCourse(courseId) {

      window.location.href =
        `player.html?courseId=${courseId}`;

    }


    // SEARCH
    searchInput.addEventListener("input", async (e) => {

      const keyword =
        e.target.value.trim();

      try {

        let url = API_BASE_URL;

        if (keyword.length > 0) {

          url =
            `${API_BASE_URL}/search?keyword=${keyword}`;

        }

        const response =
          await fetch(url);

        const courses =
          await response.json();

        renderCourses(courses);

      } catch (error) {

        console.error(error);

      }

    });


    // CATEGORY FILTER
    categoryItems.forEach(item => {

      item.addEventListener("click", async () => {

        const category =
          item.dataset.category;

        try {

          let url = API_BASE_URL;

          if (category !== "All") {

            url =
              `${API_BASE_URL}/category/${category}`;

          }

          const response =
            await fetch(url);

          const courses =
            await response.json();

          renderCourses(courses);

        } catch (error) {

          console.error(error);

        }

      });

    });


    // TOGGLE DROPDOWN
    function toggleDropdown(){

      const dropdown =
        document.getElementById('dropdown');

      dropdown.classList.toggle('hidden');

    }


    // LOGOUT
    function logout(){

      localStorage.clear();

      window.location.href = "index.html";

    }


    // CLOSE DROPDOWN OUTSIDE CLICK
    window.addEventListener('click', function(e){

      const profile =
        document.querySelector('.relative');

      const dropdown =
        document.getElementById('dropdown');

      if(!profile.contains(e.target)){

        dropdown.classList.add('hidden');

      }

    });


    // INITIAL LOAD
    loadCourses();

  </script>

</body>
</html>
