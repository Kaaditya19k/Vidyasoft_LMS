<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Page</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f4f5f7;
      color:#333;
    }

    .container{
      width:90%;
      max-width:1300px;
      margin:auto;
      padding:20px 0;
    }

    /* ================= NAVBAR ================= */

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#fff;
      padding:15px 25px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
      margin-bottom:25px;
    }

    .nav-left,
    .nav-right{
      display:flex;
      align-items:center;
      gap:20px;
    }

    .logo{
      font-size:24px;
      font-weight:600;
      color:#3b82f6;
      cursor:pointer;
    }

    .nav-menu{
      display:flex;
      gap:20px;
      margin-left:30px;
    }

    .nav-item a{
      text-decoration:none;
      color:#555;
      padding:8px 14px;
      border-radius:8px;
      transition:0.3s;
      font-weight:500;
    }

    .nav-item a:hover{
      background:#eef2ff;
      color:#3b82f6;
    }

    .material-symbols-outlined{
      font-size:24px;
      cursor:pointer;
      color:#555;
    }

    .profile{
      width:40px;
      height:40px;
      border-radius:50%;
      background:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400')
      center/cover;
      cursor:pointer;
      position:relative;
    }

    /* ================= DROPDOWN ================= */

    .dropdown{
      position:absolute;
      top:50px;
      right:0;
      background:#fff;
      border-radius:10px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      display:none;
      flex-direction:column;
      min-width:140px;
      overflow:hidden;
    }

    .dropdown div{
      padding:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .dropdown div:hover{
      background:#f1f5f9;
    }

    /* ================= HERO SECTION ================= */

    .hero{
      background:linear-gradient(to right,#efe3ff,#dff5ff);
      border-radius:20px;
      padding:40px;
      display:flex;
      align-items:center;
      gap:30px;
      margin-bottom:30px;
      position:relative;
      overflow:hidden;
    }

    .hero::before{
      content:'';
      position:absolute;
      width:140px;
      height:140px;
      background:#3ca8ff;
      border-radius:50%;
      left:-70px;
      bottom:-70px;
    }

    .hero::after{
      content:'';
      position:absolute;
      width:120px;
      height:120px;
      background:#ff1493;
      border-radius:50%;
      right:-60px;
      bottom:-60px;
    }

    .profile-image-wrapper{
      width:170px;
      height:170px;
      border-radius:50%;
      padding:8px;
      background:linear-gradient(135deg,#5d8bff,#ff2fa3);
      z-index:2;
    }

    .profile-image{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      border:6px solid white;
    }

    .profile-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .profile-content{
      z-index:2;
    }

    .profile-content h1{
      font-size:50px;
      margin-bottom:10px;
    }

    .profile-content p{
      color:#666;
      line-height:1.7;
      margin-bottom:20px;
    }

    /* ================= STATS ================= */

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:#fff;
      padding:25px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 8px 20px rgba(0,0,0,0.05);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h2{
      font-size:40px;
      margin-bottom:10px;
    }

    .card p{
      color:#666;
      font-size:14px;
    }

    @media(max-width:1000px){

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

    }

    @media(max-width:768px){

      .navbar{
        flex-direction:column;
        gap:15px;
      }

      .nav-menu{
        margin-left:0;
        flex-wrap:wrap;
        justify-content:center;
      }

      .hero{
        flex-direction:column;
        text-align:center;
      }

      .stats{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

      <div class="nav-left">

        <div class="logo">
          EduLearn
        </div>

        <div class="nav-menu">

          <div class="nav-item">
            <a href="dashboard.html">Home</a>
          </div>

          <div class="nav-item">
            <a href="courses.html">Courses</a>
          </div>

          <div class="nav-item">
            <a href="community.html">Community</a>
          </div>

          <div class="nav-item">
            <a href="profile.html">Profile</a>
          </div>

        </div>

      </div>

      <div class="nav-right">

        <span class="material-symbols-outlined">
          notifications
        </span>

        <span class="material-symbols-outlined">
          chat
        </span>

        <div class="profile" onclick="toggleDropdown()">

          <div class="dropdown" id="dropdown">

            <div>
              My Profile
            </div>

            <div onclick="logout()">
              Logout
            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- ================= PROFILE HERO ================= -->

    <section class="hero">

      <div class="profile-image-wrapper">

        <div class="profile-image">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800" alt="">
        </div>

      </div>

      <div class="profile-content">

        <h1>John Doe</h1>

        <p>
          You have 2 incomplete assignments nearing their due date.
          Complete them soon to improve your performance.
        </p>

      </div>

    </section>

    <!-- ================= STATS ================= -->

    <section class="stats">

      <div class="card">
        <h2>12</h2>
        <p>Assignments Completed</p>
      </div>

      <div class="card">
        <h2>75%</h2>
        <p>Assignments Completed</p>
      </div>

      <div class="card">
        <h2>50%</h2>
        <p>Assignments Mastered</p>
      </div>

      <div class="card">
        <h2>100</h2>
        <p>Performance Score</p>
      </div>

    </section>

  </div>

  <script>

    function toggleDropdown(){

      const dropdown = document.getElementById('dropdown');

      dropdown.style.display =
      dropdown.style.display === 'flex'
      ? 'none'
      : 'flex';
    }

    function logout(){

      localStorage.clear();

      window.location.href = "index.html";
    }

    // Close dropdown

    window.addEventListener('click', function(e){

      const profile = document.querySelector('.profile');

      const dropdown = document.getElementById('dropdown');

      if(!profile.contains(e.target)){

        dropdown.style.display = 'none';
      }

    });

  </script>

</body>
</html>
